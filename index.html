    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    section { background: white; padding: 1.5rem; margin-bottom: 1rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #004d7a; }
    .flex { display: flex; flex-wrap: wrap; gap: 2rem; }
    .skill-list li { margin-bottom: 0.5rem; }
    .lang-toggle { float: right; font-size: 0.9rem; cursor: pointer; }
    footer { text-align: center; padding: 1rem; background: #004d7a; color: white; }

</head>

  <script>
    const content = {
      en: {
        summary: `Certified Accountant with experience in corporate accounting environments. Skilled in tax strategies, financial reporting, and modern accounting tools.`,
        skills: [
          "Financial Reporting", "Studying CMA", "Tax Return Filing", "Project Budgeting",
          "Payroll", "Microsoft Office", "ERP Software", "Cash Flow Analysis",

        experience: [
          "Accountant – AL Rwasi Trading Company",
          "Accountant – AL Waha Company",
          "Accountant – Nebras Company",
          "Accountant – Wabia Trading Company"
        ]
      },
      ar: {
        summary: `محاسب معتمد بخبرة في بيئات المحاسبة للشركات. ماهر في الاستراتيجيات الضريبية، وإعداد التقارير المالية، والأدوات المحاسبية الحديثة.`,
        skills: [
          "إعداد التقارير المالية", "أدرس الآن CMA", "تقديم الإقرارات الضريبية", "إعداد ميزانية المشروع",
          "الرواتب", "مايكروسوفت أوفيس", "برامج ERP", "تحليل التدفق النقدي",
          "تسوية الحسابات", "الحسابات المستحقة / الدائنة"
        ],
        experience: [
          "محاسب – شركة الرواسي للتجارة",
          "محاسب – شركة الواحة",
          "محاسب – شركة نبراس",
          "محاسب – شركة وابيا للتجارة"
        ]
      }
    };

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.getElementById("summary").innerText = content[lang].summary;
      const skills = document.getElementById("skills");
      const exp = document.getElementById("experience");

      skills.innerHTML = content[lang].skills.map(s => `<li>${s}</li>`).join("");
      exp.innerHTML = content[lang].experience.map(e => `<li>${e}</li>`).join("");

      document.querySelectorAll("h2").forEach(h => {
        h.innerText = h.dataset[lang];
      });
    }

    setLanguage("en");
  </script>
</body>
</html>
